<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Запоминатор веса</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-card:#0F0F0F;
    --bg-card-2:#202023;
    --text-primary:#ffffff;
    --text-secondary:rgba(255,255,255,0.40);
    --green:#34c759;
    --red:#ff453a;
    --divider:rgba(255,255,255,0.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    margin:0;
    min-height:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:#000;
    font-family:"Inter Tight",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    color:var(--text-primary);
  }

  .device{
    position:relative;
    width:100%;
    max-width:430px;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:#000000;
  }
  .bg-blob{
    position:absolute;
    border-radius:9999px;
    pointer-events:none;
  }
  .bg-blob-teal{
    width:284px;
    height:236.63px;
    left:46px;
    top:-118.32px;
    background:#00DFC5;
    filter:blur(90px);
  }
  .bg-blob-white{
    width:140.25px;
    height:116.79px;
    left:117px;
    top:-58.40px;
    background:#ffffff;
    filter:blur(70px);
    opacity:.9;
  }
  @media (min-width:481px){
    body{ background:#050505; padding:24px 0; }
    .device{
      height:932px;
      border-radius:44px;
      box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 8px #111 , 0 0 0 9px #2a2a2a;
    }
  }

  .main-content{
    position:absolute;
    inset:0;
    transition:filter .28s ease;
  }
  .main-content.dimmed{ filter:blur(6px) brightness(.55); }

  /* current weight — fixed layer behind the scrolling list */
  .weight-header{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:1;
    text-align:center;
    padding:calc(env(safe-area-inset-top) + 120px) 24px 28px;
  }
  .weight-label{
    font-size:17px;
    line-height:20px;
    font-weight:500;
    color:#ffffff;
    margin-bottom:12px;
  }
  .weight-value{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
  }
  .weight-value #currentWeightValue{
    font-size:64px;
    line-height:64px;
    font-weight:500;
    letter-spacing:-1px;
  }
  .weight-value .unit{
    font-size:40px;
    line-height:64px;
    font-weight:500;
    color:#ffffff;
  }

  /* scrolling layer: slides up over the fixed weight-header/gradient */
  .scroll-container{
    position:absolute;
    inset:0;
    z-index:2;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
  }
  /* card / list */
  .sheet-card{
    background:var(--bg-card);
    border-radius:40px 40px 0 0;
    padding:8px 20px 120px;
    margin-left:8px;
    margin-right:8px;
  }
  .month-title{
    font-size:21px;
    line-height:26px;
    font-weight:500;
    letter-spacing:0;
    padding-left:8px;
    margin:24px 0 12px;
  }
  .entry-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:72px;
    padding-left:8px;
    cursor:pointer;
    background:none;
    border:none;
    border-bottom:1px solid transparent;
    width:100%;
    text-align:left;
    color:inherit;
    font:inherit;
  }
  .entry-item.with-divider{ border-bottom-color:var(--divider); }
  .entry-left{ width:168px; flex-shrink:0; }
  .entry-left .entry-weight{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:17px;
    line-height:20px;
    font-weight:500;
    letter-spacing:0;
  }
  .entry-arrow{ font-size:12px; line-height:1; }
  .entry-arrow.up{ color:var(--green); }
  .entry-arrow.down{ color:var(--red); }
  .entry-calories{
    font-size:17px;
    line-height:20px;
    font-weight:500;
    letter-spacing:0;
    color:var(--text-secondary);
    margin-top:3px;
  }
  .entry-right{
    display:flex;
    align-items:center;
    gap:4px;
    color:var(--text-secondary);
    font-size:17px;
    line-height:20px;
    font-weight:500;
    flex-shrink:0;
  }
  .entry-chevron{
    width:20px;
    height:20px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .entry-chevron::before{
    content:'';
    width:6px;
    height:6px;
    border-right:2px solid rgba(255,255,255,0.35);
    border-top:2px solid rgba(255,255,255,0.35);
    transform:rotate(45deg);
  }

  .empty-state{
    color:var(--text-secondary);
    text-align:center;
    padding:48px 0;
    font-size:15px;
  }

  /* FAB */
  .fab{
    position:absolute;
    left:50%;
    bottom:32px;
    transform:translateX(-50%);
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ffffff;
    color:#000000;
    border:none;
    border-radius:32px;
    padding:0 32px;
    font-size:17px;
    line-height:20px;
    font-weight:500;
    letter-spacing:0;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    z-index:15;
    cursor:pointer;
    white-space:nowrap;
  }
  .fab:active{ transform:translateX(-50%) scale(.97); }

  /* backdrop */
  .backdrop{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:20;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }

  /* bottom sheets */
  .bottom-sheet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    background:var(--bg-card);
    border-radius:28px 28px 0 0;
    padding:20px 24px calc(28px + env(safe-area-inset-bottom));
    transform:translateY(105%);
    transition:transform .32s cubic-bezier(.32,.72,0,1);
    z-index:30;
    max-height:80%;
    overflow-y:auto;
  }
  .bottom-sheet.open{ transform:translateY(0); }

  .close-btn{
    position:absolute;
    top:16px;
    right:16px;
    width:32px;
    height:32px;
    border-radius:32px;
    background:#1D1D1D;
    border:none;
    padding:0;
    cursor:pointer;
  }
  .close-btn::before,
  .close-btn::after{
    content:'';
    position:absolute;
    top:50%;
    left:50%;
    width:10px;
    height:2px;
    background:#838383;
    border-radius:1px;
  }
  .close-btn::before{ transform:translate(-50%,-50%) rotate(45deg); }
  .close-btn::after{ transform:translate(-50%,-50%) rotate(-45deg); }

  /* detail sheet */
  #detailSheet{
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    border-radius:40px 40px 0 0;
  }
  .detail-weight-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 8px 40px 32px;
  }
  .detail-weight{
    display:flex;
    align-items:flex-start;
    gap:6px;
  }
  .detail-weight .weight-num{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .detail-weight #detailWeightValue{
    font-size:64px;
    line-height:64px;
    font-weight:500;
    letter-spacing:-1px;
    color:#ffffff;
  }
  .detail-weight .unit{
    font-size:40px;
    line-height:64px;
    font-weight:500;
    color:#ffffff;
  }
  .detail-weight .trend-arrow{
    width:20px;
    height:20px;
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
  }
  .detail-rows{
    align-self:stretch;
    padding:0 8px 16px;
  }
  .detail-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:64px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row .row-label{
    font-size:16px;
    line-height:20px;
    font-weight:500;
    color:var(--text-secondary);
  }
  .detail-row .row-value{
    font-size:17px;
    line-height:20px;
    font-weight:500;
    color:#ffffff;
  }

  .pill-btn{
    width:100%;
    background:#ffffff;
    color:#0F0F0F;
    border:none;
    border-radius:32px;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    line-height:20px;
    font-weight:500;
    letter-spacing:0;
    margin-top:20px;
    cursor:pointer;
  }
  .pill-btn:active{ transform:scale(.98); }
  .pill-btn.ghost{
    background:rgba(255,255,255,0.04);
    color:#FFF9F9;
  }
  #detailSheet .pill-btn{ margin-top:0; }

  /* form sheet (add / edit) */
  #formSheet{
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    border-radius:40px 40px 0 0;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  #formSheet .pill-btn{ margin-top:0; }
  .form-header{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 0;
    font-size:16px;
    line-height:20px;
    font-weight:500;
    color:var(--text-secondary);
  }
  .form-inputs{
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .input-box{
    flex:1;
    border-radius:24px;
    padding:48px 8px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:rgba(255,255,255,0.03);
    border:1.5px solid transparent;
  }
  .input-box:focus-within{
    background:#161616;
    border-color:rgba(243,243,243,0.5);
  }
  .input-box input{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:#fff;
    font-size:40px;
    line-height:40px;
    font-weight:500;
    text-align:center;
    font-family:inherit;
    padding:0;
  }
  .input-caption{
    font-size:16px;
    line-height:20px;
    font-weight:500;
    color:var(--text-secondary);
  }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>

<div class="device">
  <div class="main-content" id="mainContent">
    <div class="bg-blob bg-blob-teal"></div>
    <div class="bg-blob bg-blob-white"></div>

    <div class="weight-header" id="weightHeader">
      <div class="weight-label">Текущий вес</div>
      <div class="weight-value"><span id="currentWeightValue">—</span><span class="unit">кг</span></div>
    </div>

    <div class="scroll-container" id="scrollContainer">
      <div class="scroll-spacer" id="scrollSpacer"></div>
      <div class="sheet-card" id="sheetCard">
        <div id="entriesList"></div>
      </div>
    </div>
  </div>

  <button class="fab" id="fabAdd">Новая запись</button>

  <div class="backdrop" id="backdrop"></div>

  <div class="bottom-sheet" id="detailSheet">
    <button class="close-btn" data-close aria-label="Закрыть"></button>
    <div class="detail-weight-wrap">
      <div class="detail-weight">
        <div class="weight-num"><span id="detailWeightValue">—</span><span class="unit">кг</span></div>
        <span class="trend-arrow" id="detailArrow"></span>
      </div>
    </div>
    <div class="detail-rows">
      <div class="detail-row"><span class="row-label">Дата</span><span class="row-value" id="detailDate"></span></div>
      <div class="detail-row"><span class="row-label">Каллорийность</span><span class="row-value" id="detailCalories"></span></div>
    </div>
    <button class="pill-btn ghost" id="detailEditBtn">Редактировать</button>
  </div>

  <div class="bottom-sheet" id="formSheet">
    <button class="close-btn" data-close aria-label="Закрыть"></button>
    <div class="form-header"><span id="formTitle">Новая запись</span></div>
    <div class="form-inputs">
      <label class="input-box">
        <input id="inputWeight" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        <span class="input-caption">киллограм</span>
      </label>
      <label class="input-box">
        <input id="inputCalories" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
        <span class="input-caption">ккал</span>
      </label>
    </div>
    <button class="pill-btn" id="formSubmitBtn">Добавить</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var MONTH_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var MONTH_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  var API_URL = 'https://script.google.com/macros/s/AKfycby_qvOvgwTgVbH_iuSWC1EH49TpZddte8S4F0PU8xy1SH5KJp9o8gktwRCX2Mr1Mf8y7w/exec';

  var entries = [];

  function apiList(){
    return fetch(API_URL).then(function(r){ return r.json(); });
  }
  function apiAdd(entry){
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'add', weight: entry.weight, calories: entry.calories, date: entry.date.getTime() })
    }).then(function(r){ return r.json(); });
  }
  function apiUpdate(entry){
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'update', id: entry.id, weight: entry.weight, calories: entry.calories })
    }).then(function(r){ return r.json(); });
  }

  var els = {
    mainContent: document.getElementById('mainContent'),
    weightHeader: document.getElementById('weightHeader'),
    scrollContainer: document.getElementById('scrollContainer'),
    scrollSpacer: document.getElementById('scrollSpacer'),
    sheetCard: document.getElementById('sheetCard'),
    currentWeightValue: document.getElementById('currentWeightValue'),
    entriesList: document.getElementById('entriesList'),
    fabAdd: document.getElementById('fabAdd'),
    backdrop: document.getElementById('backdrop'),
    detailSheet: document.getElementById('detailSheet'),
    detailWeightValue: document.getElementById('detailWeightValue'),
    detailArrow: document.getElementById('detailArrow'),
    detailDate: document.getElementById('detailDate'),
    detailCalories: document.getElementById('detailCalories'),
    detailEditBtn: document.getElementById('detailEditBtn'),
    formSheet: document.getElementById('formSheet'),
    formTitle: document.getElementById('formTitle'),
    inputWeight: document.getElementById('inputWeight'),
    inputCalories: document.getElementById('inputCalories'),
    formSubmitBtn: document.getElementById('formSubmitBtn')
  };

  var formMode = 'add'; // 'add' | 'edit'
  var formEditId = null;
  var activeDetailId = null;

  function fmtWeight(n){
    var s = n.toFixed(1);
    if (s.slice(-2) === '.0') s = s.slice(0, -2);
    return s.replace('.', ',');
  }
  function parseWeight(str){
    var v = parseFloat(String(str).replace(',', '.'));
    return isNaN(v) ? null : v;
  }
  function fmtCalories(n){ return String(Math.round(n)); }
  function parseCalories(str){
    var v = parseInt(String(str).replace(/[^\d]/g, ''), 10);
    return isNaN(v) ? null : v;
  }
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d){
    return d.getDate() + ' ' + MONTH_GEN[d.getMonth()] + ', ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function ascending(){ return entries.slice().sort(function(a,b){ return a.date - b.date; }); }
  function descending(){ return entries.slice().sort(function(a,b){ return b.date - a.date; }); }

  function trendMap(){
    var asc = ascending();
    var map = {};
    for (var i = 0; i < asc.length; i++){
      var prev = asc[i-1];
      if (!prev) { map[asc[i].id] = null; continue; }
      if (asc[i].weight > prev.weight) map[asc[i].id] = 'up';
      else if (asc[i].weight < prev.weight) map[asc[i].id] = 'down';
      else map[asc[i].id] = null;
    }
    return map;
  }

  function arrowGlyph(trend){
    if (trend === 'up') return '<span class="entry-arrow up">▲</span>';
    if (trend === 'down') return '<span class="entry-arrow down">▼</span>';
    return '';
  }

  function render(){
    var desc = descending();
    els.currentWeightValue.textContent = desc.length ? fmtWeight(desc[0].weight) : '—';

    if (!desc.length){
      els.entriesList.innerHTML = '<div class="empty-state">Записей пока нет</div>';
      return;
    }

    var trends = trendMap();
    var html = '';
    var currentGroupKey = null;

    desc.forEach(function(entry, idx){
      var groupKey = entry.date.getFullYear() + '-' + entry.date.getMonth();
      var isNewGroup = groupKey !== currentGroupKey;
      if (isNewGroup){
        currentGroupKey = groupKey;
        html += '<div class="month-title">' + MONTH_NOM[entry.date.getMonth()] + '</div>';
      }
      var nextEntry = desc[idx + 1];
      var isLastInGroup = !nextEntry || (nextEntry.date.getFullYear() + '-' + nextEntry.date.getMonth()) !== groupKey;
      html +=
        '<button class="entry-item' + (isLastInGroup ? '' : ' with-divider') + '" data-id="' + entry.id + '">' +
          '<div class="entry-left">' +
            '<div class="entry-weight">' + fmtWeight(entry.weight) + ' кг ' + arrowGlyph(trends[entry.id]) + '</div>' +
            '<div class="entry-calories">' + fmtCalories(entry.calories) + ' ккал</div>' +
          '</div>' +
          '<div class="entry-right"><span>' + fmtDate(entry.date) + '</span><span class="entry-chevron"></span></div>' +
        '</button>';
    });

    els.entriesList.innerHTML = html;

    Array.prototype.forEach.call(els.entriesList.querySelectorAll('.entry-item'), function(btn){
      btn.addEventListener('click', function(){
        openDetail(parseInt(btn.getAttribute('data-id'), 10));
      });
    });
  }

  function layout(){
    var headerH = els.weightHeader.offsetHeight;
    els.scrollSpacer.style.height = headerH + 'px';
    var viewportH = els.mainContent.clientHeight;
    els.sheetCard.style.minHeight = Math.max(0, viewportH - headerH) + 'px';
    onScroll();
  }

  var CARD_MARGIN = 8;

  function onScroll(){
    var headerH = els.weightHeader.offsetHeight;
    var progress = headerH > 0 ? Math.min(1, Math.max(0, els.scrollContainer.scrollTop / headerH)) : 1;
    var margin = CARD_MARGIN * (1 - progress);
    els.sheetCard.style.marginLeft = margin + 'px';
    els.sheetCard.style.marginRight = margin + 'px';
  }

  function setDimmed(on){
    els.mainContent.classList.toggle('dimmed', on);
    els.backdrop.classList.toggle('open', on);
    document.body.style.overflow = on ? 'hidden' : '';
  }

  function showSheet(sheetEl){
    els.detailSheet.classList.remove('open');
    els.formSheet.classList.remove('open');
    setDimmed(true);
    requestAnimationFrame(function(){ sheetEl.classList.add('open'); });
  }

  function closeAll(){
    els.detailSheet.classList.remove('open');
    els.formSheet.classList.remove('open');
    setDimmed(false);
    activeDetailId = null;
  }

  function openDetail(id){
    var entry = entries.find(function(e){ return e.id === id; });
    if (!entry) return;
    activeDetailId = id;
    var trend = trendMap()[id];
    els.detailWeightValue.textContent = fmtWeight(entry.weight);
    els.detailArrow.innerHTML = trend === 'up' ? '<span class="entry-arrow up">▲</span>' : (trend === 'down' ? '<span class="entry-arrow down">▼</span>' : '');
    els.detailDate.textContent = fmtDate(entry.date);
    els.detailCalories.textContent = fmtCalories(entry.calories) + ' ккал';
    showSheet(els.detailSheet);
  }

  function openForm(mode, id){
    formMode = mode;
    formEditId = id || null;

    var base = mode === 'edit' ? entries.find(function(e){ return e.id === id; }) : descending()[0];

    els.inputWeight.value = base ? fmtWeight(base.weight) : '';
    els.inputCalories.value = base ? fmtCalories(base.calories) : '';
    els.formTitle.textContent = mode === 'edit' ? 'Редактирование' : 'Новая запись';
    els.formSubmitBtn.textContent = mode === 'edit' ? 'Сохранить' : 'Добавить';

    showSheet(els.formSheet);
  }

  function submitForm(){
    var weight = parseWeight(els.inputWeight.value);
    var calories = parseCalories(els.inputCalories.value);
    if (weight === null || weight <= 0 || calories === null || calories < 0) return;

    els.formSubmitBtn.disabled = true;

    var request;
    if (formMode === 'edit' && formEditId !== null){
      request = apiUpdate({ id: formEditId, weight: weight, calories: calories }).then(function(){
        var entry = entries.find(function(e){ return e.id === formEditId; });
        if (entry){ entry.weight = weight; entry.calories = calories; }
      });
    } else {
      var date = new Date();
      request = apiAdd({ weight: weight, calories: calories, date: date }).then(function(res){
        var id = (res && res.entry && res.entry.id) || Date.now();
        entries.push({ id: id, weight: weight, calories: calories, date: date });
      });
    }

    request.then(function(){
      render();
      layout();
      closeAll();
    }).catch(function(err){
      console.error(err);
      alert('Не удалось сохранить. Проверьте соединение и попробуйте ещё раз.');
    }).then(function(){
      els.formSubmitBtn.disabled = false;
    });
  }

  function loadEntries(){
    els.entriesList.innerHTML = '<div class="empty-state">Загрузка…</div>';
    apiList().then(function(rows){
      entries = rows.map(function(r){
        return { id: r.id, weight: Number(r.weight), calories: Number(r.calories), date: new Date(Number(r.date)) };
      });
      render();
      layout();
    }).catch(function(err){
      console.error(err);
      els.entriesList.innerHTML = '<div class="empty-state">Не удалось загрузить данные. Проверьте соединение.</div>';
    });
  }

  els.fabAdd.addEventListener('click', function(){ openForm('add'); });
  els.detailEditBtn.addEventListener('click', function(){ openForm('edit', activeDetailId); });
  els.formSubmitBtn.addEventListener('click', submitForm);
  els.backdrop.addEventListener('click', closeAll);

  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function(btn){
    btn.addEventListener('click', closeAll);
  });

  window.addEventListener('resize', layout);
  window.addEventListener('load', layout);
  els.scrollContainer.addEventListener('scroll', onScroll, { passive: true });

  layout();
  loadEntries();
})();
</script>
</body>
</html>
